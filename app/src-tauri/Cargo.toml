[package]
name = "minimeeter"
version = "1.0.5"
edition = "2021"

[lib]
name = "minimeeter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
window-vibrancy = "0.5"
# App icons for the per-app mixer: HICON -> RGBA -> PNG data URL
png = "0.17"
base64 = "0.22"

[dependencies.windows]
version = "0.58"
features = [
  "UI_ViewManagement",
  "Win32_Graphics_Dwm",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  # Core Audio session control for the per-app mixer (app_sessions.rs)
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Win32_System_Threading",
  # App icon extraction (SHGetFileInfoW + GDI draw into a DIB)
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
]

[profile.release]
strip = true
lto = true
codegen-units = 1
