<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B8DFF"/>
      <stop offset="55%" stop-color="#3A5CFB"/>
      <stop offset="100%" stop-color="#241E8F"/>
    </linearGradient>
    <linearGradient id="banana" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#FFD93B"/>
      <stop offset="75%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D9820A"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#5C3A1A"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Glass background square -->
  <rect x="6" y="6" width="188" height="188" rx="46" fill="url(#bg)"/>
  <rect x="6" y="6" width="188" height="188" rx="46" fill="none" stroke="url(#glassEdge)" stroke-width="3"/>

  <!-- Glass sheen -->
  <rect x="6" y="6" width="188" height="188" rx="46" fill="url(#sheen)"/>

  <!-- Bottom inner shadow for glass depth -->
  <path d="M 20 150 Q 100 200 180 150 L 180 188 Q 100 200 20 188 Z" fill="#000000" opacity="0.12" filter="url(#soft)"/>

  <!-- Banana -->
  <g filter="url(#drop)">
    <path d="M 58 162
             C 8 130, 6 70, 54 38
             C 76 23, 106 16, 132 26
             L 140 44
             C 116 33, 90 40, 74 60
             C 52 88, 52 126, 78 150
             C 90 160, 88 174, 71 177
             C 66 178, 61 174, 58 162 Z"
          fill="url(#banana)" stroke="#B36B00" stroke-width="3" stroke-linejoin="round"/>
    <!-- stem -->
    <path d="M 132 26 C 140 18, 151 15, 158 20 C 163 24, 160 33, 153 37 L 140 44 Z"
          fill="url(#stem)" stroke="#3E2510" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Banana gloss streak -->
  <path d="M 62 155 C 44 122, 46 82, 76 52" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="8" stroke-linecap="round" filter="url(#soft)"/>

  <!-- Ripening flecks -->
  <circle cx="68" cy="128" r="2.4" fill="#9C6B12" opacity="0.5"/>
  <circle cx="88" cy="102" r="2" fill="#9C6B12" opacity="0.4"/>
  <circle cx="62" cy="98" r="1.8" fill="#9C6B12" opacity="0.4"/>
</svg>
